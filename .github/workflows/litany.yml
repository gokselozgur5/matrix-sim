# .github/workflows/litany.yml — the judge of the file that judges (#1114).
#
# WHY THIS IS A SECOND WORKFLOW IN A REPOSITORY THAT KEEPS ONE. A judge that
# lives inside `locks.yml` cannot judge a `locks.yml` that will not parse: the
# broken file is exactly the file that would have run the check. That is not
# hypothetical here — an unresolved conflict marker made the litany unparseable
# twice in one night, the run failed in zero seconds with no jobs, and the UI
# said "no checks reported", which is the same sentence it prints for a pull
# request whose CI has not started (#1109).
#
# So this file is deliberately small, deliberately boring, and reads nothing
# from the file it judges. It should change about once a year. If it ever grows
# steps of its own, the question it exists to answer has moved again and
# something else needs to be the outermost judge.

name: litany

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  litany:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No fetch-depth: this reads the tree, not its history.
      - uses: actions/checkout@v4

      # The four questions, and the suite that proves each of them can go red.
      # Streamed through tee rather than captured: the script prints one row per
      # breakage and then exits nonzero, so `out="$(...)"` would die on the
      # assignment and take the report with it — the failing rows ARE the report
      # (tools/README.md's capture rule).
      - name: tools — the litany is judged by something outside it (#1114)
        shell: bash
        run: |
          set -euo pipefail
          floor=28   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/litany.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/litany-selftest.log"
          verdict="$(grep -E '^LITANY SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
            "${RUNNER_TEMP:-/tmp}/litany-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the litany judge cannot falsify itself" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the litany suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "LITANY SUITE FLOOR OK cases=$ran floor=$floor"
          bash tools/litany.sh | tee "${RUNNER_TEMP:-/tmp}/litany.log"
          grep -q '^LITANY VERDICT PASS$' "${RUNNER_TEMP:-/tmp}/litany.log" \
            || { echo "FATAL the litany did not reach a passing verdict" >&2; exit 1; }

      # The judge cannot be the only thing that never ran. Every `run:` block in
      # every workflow, parsed by the shell that will execute it — including the
      # blocks in THIS file, which is how the unclosed quote above would have
      # been caught on the day it landed rather than eleven runs later (#1203).
      - name: tools — every workflow's shell parses, and under what (#1203, #1226)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/litany.sh --shellcheck | tee "${RUNNER_TEMP:-/tmp}/shellcheck.log"
          grep -q '^LITANY SHELL VERDICT PASS blocks=[1-9][0-9]* unparseable=0 unguarded=0$' \
            "${RUNNER_TEMP:-/tmp}/shellcheck.log" \
            || { echo "FATAL a run: block the shell cannot parse, or one with no guard" >&2; exit 1; }

      # A gate that asserts SOME cases ran, and nothing about how many, is a gate
      # a shrinking suite walks through (#1213). Two gates already carried a
      # floor; five did not, and the five include every judge added today.
      - name: tools — every suite gate carries a floor (#1213)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/litany.sh --floorcheck | tee "${RUNNER_TEMP:-/tmp}/floorcheck.log"
          grep -q '^LITANY FLOOR VERDICT PASS gates=[1-9][0-9]* unfloored=0$' \
            "${RUNNER_TEMP:-/tmp}/floorcheck.log" \
            || { echo "FATAL a suite gate asserts that SOME cases ran and nothing about how many" >&2; exit 1; }
