# .github/workflows/locks.yml — CI as a runner, not a framework (D-040, gate #137).
#
# Every PR to main carries the light-lock litany the operator used to run by
# hand: the same zero-dependency commands, with exit codes and greppable
# verdict lines as the only judges. No plugins, no build tool — the daemon
# still builds with javac alone (Dev7 / D-009). Rollback is deleting this file.

name: locks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  locks:
    runs-on: ubuntu-latest
    # WHY THIS BLOCK EXISTS AT ALL: the crown gate is the first step in this lane that
    # reads the ISSUE API, and the runner's token could not. `tools/crowns.sh` said so
    # correctly — `CROWNS VERDICT UNREADABLE limit=2000` and exit 3 — which is the refusal
    # working, on the first push after the gate landed.
    #
    # READ-ONLY, AND NARROW. Declaring `permissions` at all replaces the default with
    # exactly this list, and every step in this lane reads: the checkout wants `contents`,
    # the crown census wants `issues`, and nothing here writes anything. A lane that judges
    # a pull request has no business holding a token that could change one.
    permissions:
      contents: read
      issues: read
    # WHY: backstop only — the litany finishes in minutes; a hung JVM must not eat the meter.
    # 15 until #1052 put the release gate in the lane. That step runs this lane's own floor a
    # second time, from a clean out/, because a release gate that reused someone else's build
    # would not be the gate an operator runs. This number is still a hang-guard and not the
    # bound.
    #
    # MEASURED ON THE RUNNER, 2026-08-16 (#1326), over this lane's own history:
    #
    #   gh run list --workflow locks.yml --limit 60 --json conclusion,createdAt,updatedAt \
    #     -q '[.[] | select(.conclusion=="success")
    #          | ((.updatedAt|fromdate)-(.createdAt|fromdate))]
    #         | "runs=\(length) min=\(min) max=\(max) mean=\((add/length)|floor)"'
    #   runs=54 min=296 max=710 mean=492
    #
    # 710 s against a 1,500 s guard: 47% at the worst observed run, with 38 steps (`grep -c "^      - name:" .github/workflows/locks.yml`, 2026-08-17). The two
    # figures this comment used to carry — 76 s and 103 s — were from a laptop and described
    # a lane with roughly half these steps. A guard argued from a developer's box is a guard
    # nobody has compared against the thing it guards.
    #
    # The lane gained six steps in one day (#1291's standalone build, four tool suites, four
    # probe rows including a 20,000-tick simulation), each justified alone and none weighed
    # against the total. That is how a hang-guard becomes a bound: not one expensive step,
    # but a dozen cheap ones with nobody holding the sum. Re-run the command above when
    # adding a step whose cost you cannot state.
    timeout-minutes: 25
    steps:
      # WHY: the litany judges the tree as pushed — no caches, no artifacts from elsewhere.
      # WHY fetch-depth 0: two locks read history rather than the tree. Lock 9 compares this
      # tree's seal pin against the BASE's and reads the commit messages in between; a
      # depth-1 checkout has neither, and a gate that cannot see the base would pass every
      # move (#884). Lock 0 dates the PR's evidence against main, and a shallow clone would
      # call every honest sha unknown and blame the author for the runner's configuration.
      - name: check out the tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WHY: lock 0 — the only lock that judges a claim rather than a compilation (#822).
      # It asks the PR which main its evidence was measured against, and checks whether
      # that is still the main underneath it. Warns on drift, and fails when this PR moves
      # the seal and its 'before' is not the tree's before — a move nobody can verify.
      # Whether the seal moved is read off .github/canonical-digest, not off the body.
      #
      # The body goes through env and a file, never through interpolation into this
      # script: a PR body is text a stranger can write, and `${{ }}` into a `run:` block
      # is how that stranger runs commands on the runner.
      - name: evidence baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "${RUNNER_TEMP:-/tmp}/pr-body.md"
          bash tools/baseline.sh "${RUNNER_TEMP:-/tmp}/pr-body.md" "$BASE_SHA"

      # WHY: lock 0 judges one body against one base, so on a green day it walks one of its
      # paths and every other path is a claim. The suite runs all of them against this
      # repository's real history — including the ones the runner will almost never reach:
      # a stated sha that is not a commit, and a seal move whose 'before' is not the tree's
      # before. Every fixture is built out of git rather than hardcoded, so the suite dates
      # no better and no worse than the tree it runs in. Not PR-only: the cases are about
      # history, which a push to main also has.
      #
      # The gate names a FLOOR, because `cases=[1-9][0-9]*` asserted that SOME cases ran
      # and nothing about how many (#1040). A suite that silently lost half of them — a
      # dropped case_ line, a helper that returns early, a rename that stops matching —
      # still printed VERDICT PASS and still went green: #898's argument one instrument
      # over, where an instrument that shrinks reports success at its new size and
      # nothing compares that size to yesterday's. The suite went 15 → 17 in #1014, so
      # the number is live and moves with real work.
      # A number rather than a roster of case names: a roster guards only the names
      # typed here and stays silent about every other case, and a roster of ALL of them
      # is a second copy of a list that lives in tools/baseline.sh — the shape this file
      # already deleted once, when the sweep kept five of the bench's fifteen judged rows
      # and the two drifted apart (#789). The floor covers every case including ones
      # added after this line was written, and costs one digit in the PR that changes the
      # suite's size. What it cannot do is name the case that went missing, or refuse a
      # swap of one case for another — the per-case rows printed above it are for that.
      # Streamed through tee rather than captured, under tools/README.md's capture rule: the
      # suite prints one CASE row per fixture and then returns nonzero, so `out="$(...)"` died
      # on the assignment and took every row with it — the failing cases ARE the report.
      - name: evidence baseline — the checker's own cases
        shell: bash
        run: |
          set -euo pipefail
          floor=17   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/baseline.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/baseline-selftest.log"
          verdict="$(grep -E '^BASELINE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' "${RUNNER_TEMP:-/tmp}/baseline-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the baseline suite reached no passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the baseline suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "BASELINE SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: Temurin 17 is the JDK the locks are calibrated on; setup-java only puts javac/java on PATH.
      - name: put JDK 17 on PATH
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # WHY: lock 1 — the tree compiles from nothing, the same line release.sh runs at cut time.
      - name: compile src
        run: javac -encoding UTF-8 --release 17 -d out $(find src -name '*.java')

      # WHY: lock 2 — digest double-run at the standard budget; exit code is the verdict.
      - name: selftest (2,000 ticks)
        run: java -cp out matrix.Main --selftest

      # WHY: lock 3 — the finale gate; hardcoded 2,000 ticks once left the finale untested (skeptic finding).
      - name: selftest (6,000 ticks — full arc)
        run: java -cp out matrix.Main --selftest --ticks 6000

      # WHY: lock 4 — the D-027 budget table verdicts by exit code; the generous timeout is a
      # hang-guard, not the bound — the bound is bench's own 30 s full-arc row.
      - name: bench
        timeout-minutes: 10
        run: java -cp out matrix.Main --bench

      # WHY: lock 5 — the skeptic's bench must compile against the daemon it dissects (probes stay outside the build).
      - name: compile probes
        run: javac -encoding UTF-8 --release 17 -cp out -d probes/out probes/*.java

      # WHY: #1291 — clause 5 of the probe contract says the daemon stands without
      # `probes/`, and then says the promise is KEPT rather than assumed. The checker
      # that keeps it has existed since it was written and ran in no lane, so the
      # clause was kept by whoever remembered to type the command — which is the state
      # clause 5 exists to end. That is `A_SUITE_NOBODY_RUNS` (#1212) landing in
      # probes/, where nothing prints that verdict about anything.
      #
      # The step is placed AFTER `compile probes` on purpose: the ordinary probe
      # compile is what would HIDE the defect, because it builds probes against a
      # populated `out/` and is perfectly happy. This runs in a throwaway
      # `git archive HEAD` copy with the directory removed, which is the only way to
      # ask the question — and, because it archives HEAD rather than the working tree,
      # it also catches a src/ file that exists on a developer's disk and in nobody
      # else's clone. That is the branch that was falsified before this step landed:
      # a committed class needing an uncommitted one prints
      # `src_builds=no VERDICT BENCH_ENTANGLED` and exits nonzero.
      #
      # Three seconds measured, against a 300 s lane budget.
      - name: probes — the daemon stands without this directory (clause 5)
        shell: bash
        run: |
          set -euo pipefail
          bash probes/bench.sh --without-probes | tee "${RUNNER_TEMP:-/tmp}/clause5.log"
          grep -qE '^BENCH clause5 .* VERDICT BENCH_STANDS_ALONE$' "${RUNNER_TEMP:-/tmp}/clause5.log" \
            || { echo "FATAL src/ does not build and selftest with probes/ removed — D-009's claim is that the daemon needs javac and nothing else" >&2; exit 1; }

      # WHY: lock 6 — probes always exit 0, so the verdict line itself is the contract:
      # exact-line grep (-x), so =0 can never match =01 and a missing line fails the job.
      # This step used to carry five of those rows inline. probes/bench.sh carries the same
      # contract for every probe, beside the probes, and the two lists had drifted: fifteen
      # judged rows in the bench, five of them here, so nine guards ran only when a human
      # typed the command — and DistrictNeutral (#536) was in neither file, a
      # stream-neutrality guard nobody ran at all. Copying the missing rows into this file
      # would fix that list and keep the shape that made it, so the workflow now reads the
      # bench's table instead of keeping a rival one (#789). Adding a probe is a one-row
      # change beside the probe, and this file needs no edit — which is what #849's row
      # asked for in the sentence it shipped with.
      #
      # The law is unchanged, one level down: each judged row is grep -qxF against its exact
      # verdict line inside the script. What this step judges is the summary, which carries
      # elapsed seconds and so is matched anchored rather than exactly. --no-build reuses
      # locks 1 and 5 rather than compiling the tree twice; tee keeps the log on a red run,
      # where the failing rows are the reason to have one.
      #
      # The count in that summary is judged against a FLOOR, because `judged=[1-9][0-9]*`
      # asserted that SOME rows were judged and nothing about how many (#1073). A table
      # that quietly lost half its rows — a deleted judge line, a rename, a merge that
      # took the wrong side — still prints a green summary at its new size, and nothing
      # else in the lane compares that size to yesterday's: #1040's argument for the
      # baseline suite, one gate over in the file that made it. The bench went from
      # fifteen judged rows to fifty-five, so the number is live and moves with real
      # work — and this sentence said twenty-nine until #1342 read it back against
      # `grep -c '^  judge ' probes/bench.sh`. The floor below is the producer for that
      # count; a second copy of it in prose has no reader, which is #1130's shape, so
      # trust the argument here and the digit below it. A number rather than a roster of class names, for the reason this
      # step exists at all (#789): a roster here is a second copy of a list that lives in
      # probes/bench.sh, and the two copies drifting apart is the defect this step was
      # built to end. What a floor cannot do is name the row that went missing or refuse a
      # swap of one row for another — the PROBE/PASS rows printed above it are for that.
      - name: probe sweep (probes/bench.sh — every judged row, 6,000 ticks each)
        shell: bash
        run: |
          set -euo pipefail
          floor=71   # raise it in the PR that adds a judged row; lowering it is a claim, not a bump
          bash probes/bench.sh --no-build | tee "${RUNNER_TEMP:-/tmp}/sweep.log"
          summary="$(grep -E '^BENCH .* judged=[0-9]+ .* fail=0 .* VERDICT BENCH_GREEN$' \
            "${RUNNER_TEMP:-/tmp}/sweep.log" || true)"
          [ -n "$summary" ] \
            || { echo "FATAL the sweep printed no green summary line" >&2; exit 1; }
          judged="${summary##*judged=}"; judged="${judged%% *}"
          [ "$judged" -ge "$floor" ] \
            || { echo "FATAL the sweep judged $judged rows and the floor is $floor — rows went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "PROBE SWEEP FLOOR OK judged=$judged floor=$floor"

      # WHY: lock 7 — the one question locks 1-6 cannot ask. Locks 2 and 3 compare a run to
      # another run of the same binary, and a seal that got smaller weakens both sides
      # equally: commenting out x, y and alive in World.digestEntity passes all six locks
      # above (#898). Only a number from outside the run can refuse that, and the number
      # lives in .github/canonical-digest rather than in this file, so a declared digest
      # move is one data line edited with its reason attached and `git log -p` on that file
      # is the whole move history. Exact string compare, not a substring match: a pin that
      # matched a prefix would accept a longer sha.
      # The run is STREAMED through tee rather than captured, for the reason the GNU-dialect
      # step further down already gives (#983): `out="$(...)"` under set -e dies ON THE
      # ASSIGNMENT, so a daemon that throws mid-arc takes its own output with it and the one
      # lock that watches the seal reports a failure with nothing to read. A daemon made to
      # throw on tick 4,812 gives this step three lines — the stack trace, on stderr — and
      # none of the 48 chain links it had already printed; through the pipe the same run
      # leaves 918 lines ending at DIGEST tick=4800, which is where a reader would start
      # (#1073). Under pipefail the daemon's exit code still fails the step, and tee has put
      # the chain in the log before it does.
      - name: canonical digest (seed 42, 6,000 ticks)
        shell: bash
        run: |
          set -euo pipefail
          pin=.github/canonical-digest
          [ -f "$pin" ] || { echo "FATAL $pin is missing — the seal has no home" >&2; exit 1; }
          payload="$(grep -vE '^[[:space:]]*(#|$)' "$pin" || true)"
          n="$(printf '%s\n' "$payload" | grep -c '[^[:space:]]' || true)"
          [ "$n" = 1 ] || { echo "FATAL $pin holds $n payload lines, want exactly 1" >&2; exit 1; }
          sha="$(printf '%s\n' "$payload" | awk '{print $1}')"
          printf '%s\n' "$sha" | grep -qxE '[0-9a-f]{64}' \
            || { echo "FATAL $pin does not open with a 64-hex sha: $sha" >&2; exit 1; }
          [ "$(printf '%s\n' "$payload" | awk '{print NF}')" -ge 2 ] \
            || { echo "FATAL $pin gives a sha and no reason; the payload is <sha> then why it is the sha" >&2; exit 1; }
          want="DIGEST tick=6000 sha=$sha"
          java -cp out matrix.Main --headless --ticks 6000 --seed 42 \
            | tee "${RUNNER_TEMP:-/tmp}/canonical.log"
          got="$(grep -E '^DIGEST tick=6000 ' "${RUNNER_TEMP:-/tmp}/canonical.log" || true)"
          printf 'pinned %s\nprinted %s\n' "$want" "${got:-<no DIGEST tick=6000 line at all>}"
          [ "$got" = "$want" ] || { echo "FATAL the seal moved — if that was deliberate, edit $pin in this PR and say why" >&2; exit 1; }

      # WHY: lock 12 — the other half of `DIGEST = hash(snapshot bytes)`, and it stands here
      # because lock 7 pins the same walk from the other end. `--snapshot-at` is the surface
      # that proves that sentence holds by construction, and until #967 it had two readers in
      # the whole tree: the parser that accepts the flag and the README that describes it.
      # Main printed SNAPSHOT_MATCHES_DIGEST and no automated reader ever looked at the value,
      # so a build that printed `false` passed every lock this repository had.
      # Two refusals, because the claim has two ways to be wrong. A `false` verdict says the
      # retained walk and the hashed walk have drifted apart — #794 reports one Snapshot.of
      # overload that is structurally a frame short, and this is the step that would name it at
      # the tick it broke rather than by reading. A moved sha beside a `true` verdict says the
      # two walks agree about a world that is no longer the pinned one: the README's hand-cut
      # pair had exactly that failure twice, stale on the front page while the litany was green
      # (#865, #961). The pin lives in .github/canonical-snapshot for lock 7's reason — one data
      # line, its reason attached, `git log -p` on the file as the move history — and it carries
      # the byte count as well as the sha, because the byte count is the half a shrinking seal
      # moves first. The command is the README's, character for character, seed left to its
      # default: what this step guards is the line a stranger types to check their own build.
      - name: canonical snapshot (the retained walk certifies the chain, tick 500 of 600)
        shell: bash
        run: |
          set -euo pipefail
          pin=.github/canonical-snapshot
          [ -f "$pin" ] || { echo "FATAL $pin is missing — the certificate has no home" >&2; exit 1; }
          payload="$(grep -vE '^[[:space:]]*(#|$)' "$pin" || true)"
          n="$(printf '%s\n' "$payload" | grep -c '[^[:space:]]' || true)"
          [ "$n" = 1 ] || { echo "FATAL $pin holds $n payload lines, want exactly 1" >&2; exit 1; }
          sha="$(printf '%s\n' "$payload" | awk '{print $1}')"
          bytes="$(printf '%s\n' "$payload" | awk '{print $2}')"
          printf '%s\n' "$sha" | grep -qxE '[0-9a-f]{64}' \
            || { echo "FATAL $pin does not open with a 64-hex sha: $sha" >&2; exit 1; }
          printf '%s\n' "$bytes" | grep -qxE '[0-9]+' \
            || { echo "FATAL $pin gives no byte count after the sha: $bytes" >&2; exit 1; }
          [ "$(printf '%s\n' "$payload" | awk '{print NF}')" -ge 3 ] \
            || { echo "FATAL $pin gives a sha and a count and no reason; the payload is <sha> <bytes> then why they are the values" >&2; exit 1; }
          want="SNAPSHOT tick=500 sha=$sha bytes=$bytes"
          out="$(java -cp out matrix.Main --headless --ticks 600 --snapshot-at 500)"
          got="$(printf '%s\n' "$out" | grep -E '^SNAPSHOT tick=500 ' || true)"
          printf 'pinned %s\nprinted %s\n' "$want" "${got:-<no SNAPSHOT tick=500 line at all>}"
          printf '%s\n' "$out" | grep -qxF 'SNAPSHOT_MATCHES_DIGEST=true' \
            || { echo "FATAL the retained walk does not certify the chain's own line for tick 500" >&2; exit 1; }
          [ "$got" = "$want" ] || { echo "FATAL the snapshot pin moved — if that was deliberate, edit $pin in this PR and say why" >&2; exit 1; }

      # WHY: lock 8 — D-020's line grammar is a BYTE contract, and nothing owned the charset
      # those bytes were written in (#836): with no locale exported JDK 17 resolves the
      # default charset to ANSI_X3.4-1968 and every em dash a main() printed became '?'.
      # This runner is NOT that box — the ubuntu-latest image exports a UTF-8 locale, and
      # pre-fix main printed the em dash here intact — which is exactly why the step forces
      # LC_ALL=C instead of trusting the environment. The lane that has to catch a
      # locale-dependent defect cannot wait to be run on a hostile box; it makes one.
      # Three captures because the pin has three ways to be forgotten — the daemon's stdout,
      # its stderr, a probe's stdout — plus the source scan, because those three are instances
      # and every Java main in the tree is the class. Each capture is asserted to CARRY the byte
      # the bug destroys: a check that compares two empty files passes and proves nothing.
      - name: charset — an instrument line is the same bytes on every box (#836)
        shell: bash
        run: |
          set -euo pipefail
          same() { # same <label> <utf8-capture> <ascii-capture>
            cmp -s "$2" "$3" && echo "CHARSET $1 OK" \
              || { echo "FATAL $1 differs between UTF-8 and LC_ALL=C" >&2; diff "$2" "$3" >&2; exit 1; }
          }
          carries() { # carries <file> <byte sequence the run must have printed>
            grep -q "$2" "$1" || { echo "FATAL $1 carries no $2 — this check proves nothing" >&2; exit 1; }
          }
          java -cp out matrix.Main --help > help.utf8
          LC_ALL=C java -cp out matrix.Main --help > help.ascii
          carries help.utf8 '—'
          same daemon_stdout help.utf8 help.ascii
          java -cp out matrix.Main --scale 0 2> err.utf8 || true
          LC_ALL=C java -cp out matrix.Main --scale 0 2> err.ascii || true
          carries err.utf8 '—'
          same daemon_stderr err.utf8 err.ascii
          java -cp out:probes/out DistrictNeutral > dn.utf8
          LC_ALL=C java -cp out:probes/out DistrictNeutral > dn.ascii
          carries dn.utf8 '·'
          same probe_stdout dn.utf8 dn.ascii
          rm -f help.utf8 help.ascii err.utf8 err.ascii dn.utf8 dn.ascii
          # The scan reads `find probes tools`, not `probes/*.java`: tools/ is outside the
          # daemon build but not outside D-020, and the one tool written in Java writes the
          # page a lane now pins, with its own utf8() call guarded by nothing at all (#1042).
          # A rule enforced in one directory and hoped for in the next is #965 one level down.
          #
          # The guard used to be `grep -q ...main... || continue`, and `|| continue` cannot
          # tell a file with no main from a file grep DECLINED to read: a raw NUL makes a
          # source binary, a grep that skips binaries answers false for it, and that skip logs
          # exactly like a pass (#1039). So the hole is found with tr and cmp, not with grep —
          # the judged set is then the same on every box, rather than a report on the local
          # grep — and a file this scan cannot read is named and red, not quietly exempt.
          # scanned floors at 1 because a widened scan that matched nothing would otherwise
          # print a green sweep of nothing.
          scanned=0 unpinned=0 unreadable=0
          for f in $(find probes tools -name '*.java' | LC_ALL=C sort); do
            if [ ! -r "$f" ] || ! tr -d '\000' < "$f" | cmp -s - "$f"; then
              echo "FATAL $f is unreadable or holds a raw NUL — some greps decline it, so this scan cannot judge it" >&2
              unreadable=$((unreadable + 1))
              continue
            fi
            grep -q 'static void main(String\[\] args)' "$f" || continue
            scanned=$((scanned + 1))
            grep -q 'matrix\.Streams\.utf8();' "$f" \
              || { echo "FATAL $f prints without pinning its streams" >&2; unpinned=$((unpinned + 1)); }
          done
          [ "$scanned" -ge 1 ] || { echo "FATAL the scan found no main at all — that is a green sweep of nothing" >&2; exit 1; }
          [ "$unpinned" -eq 0 ] && [ "$unreadable" -eq 0 ] || exit 1
          echo "CHARSET main_pins OK scanned=$scanned unpinned=0 unreadable=0"

      # WHY: lock 9 — lock 7 refuses an UNDECLARED move, and there is exactly one way to
      # make it green again: paste the printed sha into the pin. That keystroke is the same
      # whether the mover reasoned or was tired of the red X, and afterwards the tree cannot
      # tell them apart — which is how a control group quietly stops being one (#884, RULING
      # #212). This step asks the other half: the pin moved, so was that a decision? It is
      # armed by the act it governs — NONE and green for every unit that leaves the world's
      # bytes alone, and it cannot be satisfied by editing this file, because what it reads
      # is a commit message and the pin's own reason field.
      # PR-only, and for the same reason the attribution step is: a push to main has no base
      # branch to compare against, and by then the move has already landed — this gate is
      # meant to be met before the merge button, not to paint main red after it.
      - name: the seal moved, so the move is argued (#884)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/digest-move.sh --base "origin/$BASE_REF"

      # WHY: the commit leg of D-060 counted zero of the 258 unit commits this repository had
      # shipped, because they carried an address GitHub resolves to the owner's OTHER account
      # (#910). A global `git config` is invisible to everyone who did not type it, so the rule
      # gets a reader rather than a note. PR-only: a push to main has no pull request to read,
      # and by then the commit is already in the history this is meant to keep clean.
      - name: tools — every commit on this PR is attributed to the owner (#910)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/attribution.sh --pr ${{ github.event.pull_request.number }}

      # WHY: tools/ had no runner at all, and #901 is the bug that hides exactly there —
      # a GNU-only `date -d` idiom, green on this box and dead on the macOS box that is the
      # only one to ever type the command. This step owns the LINUX half of that unit: the
      # operator proves the BSD dialect by running it, the runner proves the GNU one, and
      # the asserted `dialect=gnu` is what stops this from re-proving the same half twice.
      # Needs no token and no network — it judges the calendar, not the account.
      # The run is piped to tee rather than captured, for the same reason the sweep and the
      # golden day are: `out="$(...)"` under set -e dies ON THE ASSIGNMENT when the script
      # exits 5, so the printf that would have shown the eleven executed cases never ran, and
      # neither did the FATAL two lines below it — the one lock built to catch a dialect bug
      # reported one as a red step with an empty log (#983). Through the pipe, tee has already
      # put the failing offsets in the log by the time pipefail fails the step, and an executed
      # case is the only thing that tells the two boxes apart. That is now the shop's rule
      # rather than this step's habit: tools/README.md, the capture rule.
      - name: tools — balance.sh day arithmetic, GNU dialect (#901)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/balance.sh --datecheck | tee "${RUNNER_TEMP:-/tmp}/datecheck.log"
          grep -q '^DATECHECK VERDICT PASS dialect=gnu ' "${RUNNER_TEMP:-/tmp}/datecheck.log" \
            || { echo "FATAL the runner did not reach a passing GNU-dialect verdict" >&2; exit 1; }

      # WHY: #828's complaint is a claim about what the meter CAN say — that no window could
      # reach verdict=OK — and a reachability claim is worth exactly what an executed case
      # makes it worth. --rulercheck runs the ruler and the floor over day vectors whose right
      # answers arithmetic already settled, including the pair that IS the unit: one sweep day
      # beside six ordinary ones reads LAGGING:review by events and OK by day-shape. Needs no
      # token and no network — it judges the arithmetic, not the account.
      # Streamed through tee rather than captured, under tools/README.md's capture rule: a case
      # the ruler gets wrong prints its row with the reading it wanted and then exits 5, and a
      # capture threw that row away — a wrong verdict without its case is unactionable.
      # WHY: #1164 — this gate is armed by an ACT, a moved pin, so walking its paths meant
      # moving a seal, and nothing walked them until now. The suite builds its fixtures in a
      # scratch clone of this history: a pin moved with and without its paragraph, and with
      # and without its stamp. The two that matter are the REFUSALS — a gate whose only
      # exercised path is the green one is #898's argument one file over.
      # Streamed through tee under tools/README.md's capture rule: the suite prints one row
      # per case and then returns nonzero, so a capture would take the failing rows with it.
      - name: tools — the digest-move gate walks its own refusals (#1164)
        shell: bash
        run: |
          set -euo pipefail
          floor=5    # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/digest-move.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/digest-move-selftest.log"
          verdict="$(grep -E '^DIGEST MOVE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
            "${RUNNER_TEMP:-/tmp}/digest-move-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the seal gate reached no passing verdict over its own paths" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the seal suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "DIGEST MOVE SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1164 — this tool's central claim is about DATES ("a repair that changes when
      # the work happened is not a repair", #1012) and no amount of reading a git command
      # tells you what it does to them. The suite runs the advised repair on a three-commit
      # fixture in a scratch clone and compares the author dates before and after — and runs
      # the OLD advice beside it, so the difference between the two commands is a
      # measurement rather than a sentence in a comment.
      - name: tools — the attribution repair keeps the dates it repairs (#1164)
        shell: bash
        run: |
          set -euo pipefail
          floor=12   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/attribution.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/attribution-selftest.log"
          verdict="$(grep -E '^ATTRIBUTION SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
            "${RUNNER_TEMP:-/tmp}/attribution-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the attribution repair reached no passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the attribution suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "ATTRIBUTION SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1185 — `--twice` byte-compares every probe's output against a second run of
      # itself, and no lane had ever run it: `INSTRUMENTS_DRIFTED` was a verdict nothing
      # read. Run by hand for the first time today, it immediately found `UnparkStorm`
      # printing nanosecond percentiles that move with the JIT (#1184).
      #
      # It is not switched on wholesale, because it doubles a 208 s sweep against the
      # 300 s ceiling this lane set itself (#1115). It runs over the probes THIS pull
      # request touched, which is the shape the defect actually arrives in — a probe added
      # or edited without its author running the pass — and costs nothing at all on the
      # majority of units, which touch no probe.
      #
      # Skipped rows count as UNCHECKED, never STABLE: #970's identity (probes = stable +
      # drift + exempt + unchecked) exists so a pass over a subset cannot report itself as
      # a pass over the whole.
      - name: probes — the determinism pass, over what this PR touched (#1185)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD -- 'probes/*.java' \
                     | xargs -r -n1 basename | sed 's/\.java$//' | paste -sd, -)"
          if [ -z "$changed" ]; then
            echo "TWICE skipped=no-probe-touched"
            exit 0
          fi
          echo "TWICE probes=$changed"
          bash probes/bench.sh --no-build --twice-changed "$changed" \
            | tee "${RUNNER_TEMP:-/tmp}/twice.log"
          # The VERDICT, not one field of it (#1247). `drift=0` was read because the
          # verdict word for a correct narrowed run was INSTRUMENTS_UNPROVEN — a lane
          # cannot demand a word that fires on success, so it read around it, and a
          # verdict nothing reads is the state this bench hunts in other people's
          # scripts. NARROWED is now the word a narrowed pass prints, so the lane can
          # ask for it: STABLE if the narrowing selected everything, NARROWED if it
          # did not, and nothing else is green.
          grep -qE '^BENCH determinism .* drift=0 .* VERDICT INSTRUMENTS_(NARROWED|STABLE)$' \
            "${RUNNER_TEMP:-/tmp}/twice.log" \
            || { echo "FATAL a probe this PR touched does not reproduce its own output" >&2; exit 1; }

      - name: tools — balance.sh ruler and floor (#828)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/balance.sh --rulercheck | tee "${RUNNER_TEMP:-/tmp}/rulercheck.log"
          grep -q '^RULERCHECK VERDICT PASS ' "${RUNNER_TEMP:-/tmp}/rulercheck.log" \
            || { echo "FATAL the ruler did not reach a passing verdict" >&2; exit 1; }

      # WHY: #1212 — `checkage.sh` has had a fourteen-case suite and no workflow
      # anywhere that runs it. The tool answers "is this green current, or did it
      # judge a different litany" (#1017), which is a question the merge rule leans
      # on; its judge had never been executed by anything but a hand. Like
      # `prstate.sh` the tool itself cannot be a step — it reads a pull request that
      # does not exist while the pull request is being built — so the suite is the
      # whole lane-side contract.
      - name: tools — checkage.sh's judge separates its verdicts (#1212)
        shell: bash
        run: |
          set -euo pipefail
          floor=14   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/checkage.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/checkage.log"
          verdict="$(grep -E '^CHECKAGE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
            "${RUNNER_TEMP:-/tmp}/checkage.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL checkage's judge cannot separate its own verdicts" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the checkage suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "CHECKAGE SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1210 — `prstate.sh`'s catalog row says "only its judge runs in the lane",
      # and its judge did not. The tool itself cannot be a step (the run that would carry
      # it is the thing it exists to report missing), so the judge is the whole lane-side
      # contract — and it was prose. Its suite takes no token and no network by
      # construction: `judge` is a pure function of three strings, which is why the five
      # verdicts are testable at all.
      - name: tools — prstate.sh's judge separates its five verdicts (#1210)
        shell: bash
        run: |
          set -euo pipefail
          floor=39   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/prstate.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/prstate.log"
          verdict="$(grep -E '^PRSTATE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
            "${RUNNER_TEMP:-/tmp}/prstate.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL prstate's judge cannot separate its own verdicts" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the prstate suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "PRSTATE SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1095 — three tools in one day printed advice that was wrong in a way only
      # executing it revealed, and advice is the most expensive prose in a tool to be wrong
      # in: it is read once somebody has already decided to act. This audits the half that
      # is decidable without running anything — a printed flag exists in the tool it names —
      # and JUDGES the half that is not: a tool with no --selftest has nowhere for its
      # advice to be executed, and since #1311 that is a red build and not a report. This
      # sentence said *four tools have no --selftest* until #1342 — true when written,
      # false from the moment #1307 and #1309 gave the last two their suites, and
      # load-bearing in between, since it was the stated reason the check was only a
      # report. Needs no token and no network; it reads tools/.
      # Streamed through tee under this file's own capture rule: the script prints one row
      # per unimplemented flag and then exits nonzero, so a capture would die on the
      # assignment and take the rows with it.
      - name: tools — a printed flag exists in the tool it names (#1095)
        shell: bash
        run: |
          set -euo pipefail
          # The status is CAUGHT rather than allowed to kill the pipeline (#1432).
          # `advice.sh` now spends the 1 its row promises for a break, and under
          # `pipefail` that would end this step before the grep below — so the lane
          # would go red with a bare pipefail instead of the sentence that says what
          # was found. Caught, then read: a break is 1 and anything above it is the
          # tool falling over, which is a different report and must not be silent.
          rc=0
          bash tools/advice.sh | tee "${RUNNER_TEMP:-/tmp}/advice.log" || rc=$?
          grep -q '^ADVICE VERDICT EVERY_FLAG_ADVISED_EXISTS$' "${RUNNER_TEMP:-/tmp}/advice.log" \
            || { echo "FATAL a tool advises a flag nobody implements" >&2; exit 1; }
          [ "$rc" -le 1 ] \
            || { echo "FATAL tools/advice.sh left with $rc — that is a crash, not a verdict" >&2; exit 1; }

      # WHY: #1265 — the step above judges every program in tools/ on whether their advice can be
      # executed, and the program giving the judgement had no suite of its own. Its checks
      # were falsified by transcripts in pull requests, which is evidence that ages: the next
      # edit to an extraction pattern had nothing to run. `A_SUITE_NOBODY_RUNS` is a verdict
      # this same tool prints about other people's scripts, so the suite lands in a lane in
      # the pull request that adds it, with a floor, per this file's own rule.
      # WHY: #1246 — the backlog classifier decides which open issues carry evidence, and a
      # classifier nobody can watch fail is the thing this shop keeps finding in other people's
      # scripts. The suite takes no token and no network: it feeds bodies to the predicate
      # directly, so the lane exercises the classification and never the API.
      # WHY: #1307 — #1276 gave issuetree.sh two refusals it did not have (a missing
      # argument left with 1, a typo was walked as an issue number and reported as an
      # unreadable node). Both were verified by hand, once, which is the state
      # `advice.sh` prints UNFALSIFIABLE about. The suite covers the DOOR only: argument
      # handling needs no token and no network, and a fixture that faked `gh` would test
      # the fake.
      - name: tools — the issue tree's own refusals (#1307)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/issuetree.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/issuetree-selftest.log"
          verdict="$(grep -E '^ISSUETREE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/issuetree-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the issue tree's suite did not reach a passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=6    # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "ISSUETREE SUITE FLOOR OK cases=$ran floor=$floor"
      # WHY: #1309 — the last tool with no suite, and writing one found three refusals
      # spending exit 1 through bash's `${1:?…}` while two hand-written ones in the same
      # file spent 2. `unfalsifiable=` reaches 0 with this, which is what would let that
      # counter become a gate rather than a report (#1095 declined to make it one while
      # four tools had none).
      - name: tools — the sub-issue cutter's own refusals (#1309)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/subissue.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/subissue-selftest.log"
          verdict="$(grep -E '^SUBISSUE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/subissue-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the sub-issue cutter's suite did not reach a passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=6    # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "SUBISSUE SUITE FLOOR OK cases=$ran floor=$floor"

      - name: tools — the backlog classifier's own suite (#1246)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/backlog.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/backlog-selftest.log"
          verdict="$(grep -E '^BACKLOG SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/backlog-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the backlog classifier's suite did not reach a passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=27   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "BACKLOG SUITE FLOOR OK cases=$ran floor=$floor"

      - name: tools — the flag audit's own suite (#1265)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/advice.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/advice-selftest.log"
          verdict="$(grep -E '^ADVICE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/advice-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the flag audit's suite did not reach a passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=82   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "ADVICE SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1394 — `docs/adr/README.md` has described an idempotent back-edge pass since
      # D-029 and no such program existed, so every `Referenced by:` line in the tree was
      # typed from memory, which is the one thing that sentence says they are not. The
      # suite is what is judged here and not the tree: the web is INCOMPLETE today (70 of
      # 180 links), and a step asserting anything about `docs/adr` would be asserting the
      # debt and would have to be edited by whoever pays it. What must not regress is the
      # checker's ability to tell an edge from a mention — the fixture that separates a
      # prose D-number from a markdown link is the one thing standing between this and a
      # checker that is green by construction.
      - name: tools — the back-edge reader's own suite (#1394)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/backedge.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/backedge-selftest.log"
          verdict="$(grep -E '^BACKEDGE SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/backedge-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the back-edge reader's suite did not reach a passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=15  # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "BACKEDGE SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1459 — `CLAUDE.md` says every class has a crown and eighteen of eighty-nine did
      # not, seven of them named in no issue in the repository's history. A crown is an ISSUE,
      # so no probe can see the gap — probes read the tree — and this is the only reader the
      # rule has. What runs here is the SUITE and not the count: the count needs a token, and
      # the gap is reported rather than judged until #1459's exemption question is answered.
      # What must not regress is the matcher's ability to tell a crown from a unit issue about
      # the same class, since counting one as the other reports the gap as smaller than it is.
      - name: tools — the crown census's own matchers (#1459)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/crowns.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/crowns-selftest.log"
          verdict="$(grep -E '^CROWNS SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/crowns-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the crown census suite did not reach a passing verdict" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=4   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "CROWNS SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: the crown gate, installed at zero (#1459). `CLAUDE.md` states the rule without
      # qualification — every class has a crown — and eighteen of eighty-nine did not, seven
      # of them named in no issue in the repository's history. The count was REPORTED for
      # exactly as long as it took to earn the zero, which is #1311's rule and the caveat
      # this repository wrote into tools/README.md today: at one a gate demands a unit from
      # whoever trips it.
      #
      # THE EXEMPTION QUESTION ANSWERED ITSELF. #1459 left open whether all eighty-nine
      # warrant a record — `Geo`, `Family` and `Origin` looked like enums where a crown is
      # ceremony. All three turned out to have the strongest arguments of the eleven:
      # `Family`'s axis ORDER is load-bearing on every sheet in the world, `Geo` owns the
      # widen-before-subtract law, `Origin` stopped being a String because an unbounded tag
      # made the census refuse to count. Nobody needed an exemption, so the rule keeps none.
      #
      # `classes_none=0` is the other half and it is on the verdict line for the reason the
      # gate-at-zero caveat gives: a zero qualifies when its population is separately
      # asserted non-empty, and a reading that found no classes must not print the line a
      # fully-crowned tree prints (#1207, #970).
      #
      # `crownless=` is NOT gated. It rides the census, both of today's two are legitimate —
      # a crown cut ahead of its class, and a closed crown for a class that has gone — and a
      # gate on it would refuse the next crown somebody writes before the unit that builds
      # the class. That is the shape a gate must not have.
      - name: tools — every class still has a crown (#1459)
        env:
          # The census reads the issue API and the lane had no token for it. Read-only,
          # same repository, and the job's permissions block above narrows it to issues.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/crowns.sh | tee "${RUNNER_TEMP:-/tmp}/crowns.log"
          grep -qE '^CROWNS VERDICT COUNTED classes=[0-9]+ crowned=[0-9]+ uncrowned=0 classes_none=0$' \
            "${RUNNER_TEMP:-/tmp}/crowns.log" \
            || { echo "FATAL a class has no crown, or the census read no classes at all" >&2; exit 1; }
          echo "CROWNS GATE OK uncrowned=0 classes_none=0"

      # WHY: a probe's catalog row is the only place that says what its counters MEAN,
      # and until #1356 nothing compared the two lists. `roster_check` asks whether a probe
      # HAS a row; a row can keep describing the instrument it was two units ago while the
      # probe grows a counter, a mode, or a second question. #1319 repaired two such rows by
      # hand and nothing would have caught the third.
      #
      # What runs here is the SUITE and not the count, and the reason is #1311's rule: a gate
      # installs at zero and not at one, because at one it demands a unit from whoever trips
      # it. The first reading is missing=6, so the order #1369 states is edits first and gate
      # second — this step protects the READER until the gate can be installed honestly.
      #
      # The two things that must not regress are the two the reader gets wrong most easily:
      # the token matcher (a substring read called `ticks` named because a row says "6,000
      # ticks", which is wrong in the direction that hides findings) and the guard exemption
      # being a LIST rather than a pattern, since a pattern exempts every future counter
      # named that way including one that means something specific.
      - name: tools — the counter-row reader's own cases (#1356)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/counters.sh --selftest | tee "${RUNNER_TEMP:-/tmp}/counters-selftest.log"
          verdict="$(grep -E '^COUNTERS SELFTEST VERDICT PASS cases=[0-9]+ failed=0$' \
                       "${RUNNER_TEMP:-/tmp}/counters-selftest.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the counter-row suite did not reach a passing verdict" >&2; exit 1; }
          # 29 -> 17 (#1586): twelve cases went to CatalogFlags with the two readings they
          # drive. A floor coming DOWN is a claim and this is it — the cases exist, one
          # probe over, under CATALOG SELFCHECK, and that gate floor moved up by the same
          # twelve. Lowering it without saying so is the thing this comment forbids.
          # 17 -> 21 (#1588): four cases for the walk that lost three rows. The claim
          # above still holds — those twelve went to CatalogFlags — and these four are new.
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          floor=21   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "COUNTERS SUITE FLOOR OK cases=$ran floor=$floor"

      # WHY: #1590 — two readers of one table, and until #1588 nothing compared them.
      # `counters.sh` walks `probes/bench.sh` in shell and `CatalogFlags` in Java, and
      # the shell one returned 67 of 70 rows for the file's whole life. It was found by
      # accident: a Java reader answered the same question and disagreed. One home per
      # language is #1512's rule and it cannot make two languages agree — only a
      # comparison can, and this is it. Two integers, both already printed.
      - name: probes — the two bench readers agree on how many rows there are (#1590)
        shell: bash
        run: |
          set -euo pipefail
          shell_rows="$(bash tools/counters.sh | grep -oE '^COUNTERS_CENSUS rows=[0-9]+' | grep -oE '[0-9]+')"
          java_rows="$(java -cp out:probes/out CatalogFlags | grep -oE 'bench_rows=[0-9]+' | grep -oE '[0-9]+')"
          echo "BENCH READERS shell=$shell_rows java=$java_rows"
          [ -n "$shell_rows" ] && [ -n "$java_rows" ] \
            || { echo "FATAL one of the two readers printed no row count" >&2; exit 1; }
          [ "$shell_rows" = "$java_rows" ] \
            || { echo "FATAL the two readers of probes/bench.sh disagree: shell=$shell_rows java=$java_rows" >&2; exit 1; }

      # WHY: the gate, installed at zero (#1356, #1311's rule). The reader landed as a
      # REPORT because its first run was missing=6 and no_row=1, and a gate at one demands
      # a unit from whoever trips it rather than from whoever caused it. #1472 named the
      # nine counters and #1473 gave the judged probe with no row a row, so the number is
      # zero and the gate is honest.
      #
      # `missing=0` is the judged half: a probe that grows a pinned counter its catalog row
      # does not name turns this red, which is the sentence #1356's done-when asked for.
      # `no_row=0` is judged too, and it is the half `roster_check` cannot cover — that
      # check compares disk against catalog and disk against bench, and CensusSampleSize
      # was judged on every push with no row while a sentence in the catalog claimed it had
      # no bench row either. A stale exemption is worse than no exemption.
      #
      # `exempt=` is deliberately NOT judged. It is the guard family — twelve names with
      # reasons, never a pattern — and a gate on it would break the day a new probe
      # legitimately carries a `*_none=`. The list is the visible part; growth is a review
      # question, not a lane question.
      #
      # WHY THE GATE IS HERE AND NOT THE TOOL'S EXIT CODE. `counters.sh` documents five
      # codes already — 0 counted, 1 a suite case failed, 2 refused, 3 unreadable, 4
      # nothing read — so `missing>0` would either collide with 1, which means the SUITE
      # broke and sends a reader to the wrong file, or claim a sixth code for a judgement
      # the lane can make with a grep. `subissue.sh` spent the wrong code for three
      # refusals until #1309 and neither of `advice.sh`'s exit checks could see it; one
      # code with two meanings is a defect this shop has already paid for.
      #
      # The grep is EXACT-LINE, so `missing=0` can never match `missing=01`, and it is
      # falsifiable rather than believed: removing the `=` from one counter in one catalog
      # row prints `UNNAMED GrammarTwins diverged`, `missing=1`, and this step refuses.
      #
      # Streamed through tee under tools/README.md's capture rule: the reader prints one
      # UNNAMED row per finding and then returns, so a capture would take the rows with it
      # and the rows ARE the report.
      - name: probes — every pinned counter is named in its catalog row (#1356)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/counters.sh | tee "${RUNNER_TEMP:-/tmp}/counters.log"
          grep -qE '^COUNTERS VERDICT COUNTED pinned=[0-9]+ named=[0-9]+ missing=0 exempt=[0-9]+ pinned_none=0$' \
            "${RUNNER_TEMP:-/tmp}/counters.log" \
            || { echo "FATAL a pinned counter is not named in its probe's catalog row, or nothing was read" >&2; exit 1; }
          grep -qE '^COUNTERS_CENSUS .* no_row=0 ' "${RUNNER_TEMP:-/tmp}/counters.log" \
            || { echo "FATAL a class the bench judges has no catalog row — roster_check cannot see this one" >&2; exit 1; }
          echo "COUNTERS GATE OK missing=0 no_row=0"

      # WHY: #952 — the lane above judges whether the VERDICT is right about the day it was
      # given; nothing judged the REMEDY printed under it. The DEFICIT line's four numbers each
      # solve one leg with the other three standing still, so acting on two of them leaves a leg
      # thinner than it started, and one of them can push a leg the line printed 0 for under the
      # floor. --judgecheck does what the line says and reads the day that comes back: every row
      # asserts that the PLAN set leaves no leg thin, and the rows where the alternatives do NOT
      # survive being taken together are executed rather than described. No token, no network.
      - name: tools — balance.sh deficit advice (#952)
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash tools/balance.sh --judgecheck)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^JUDGECHECK VERDICT PASS cases=' \
            || { echo "FATAL the deficit advice did not reach a passing verdict" >&2; exit 1; }

      # WHY: lock 11 — the teleprinter's golden day (D-047, #965). Locks 2, 3 and 7 pin the
      # daemon's BYTES; nothing pinned the SENTENCES a tool writes over them, and --check-golden
      # was written to ask that question and then never asked by anything — three grep hits, all
      # inside the file that implements it. Unrun, it drifted from the moment it landed: the
      # blessing was taken against a tree older than its own commit and was already 198 bytes
      # behind at dc5bea4, and the world has moved twice more since. A golden file no lane runs
      # is a comment (tools/README.md's own house rule), so the lane runs it.
      # tools/ is outside the daemon build, so this step compiles the reader itself — against
      # lock 1's out/, which is why it stands after it and not with the other tools steps by
      # accident. Needs no token and no network: it renders one day and compares it to a file.
      # The tool exits 1 on drift and prints the first line that moved, so the run is piped to
      # tee rather than captured — under pipefail the exit code fails the step AND the moved
      # line reaches the log, which is the whole point of a drift report. The verdict grep is
      # exact-line but for the byte count, so an empty or truncated page cannot pass as OK.
      - name: tools — the teleprinter's golden day (#965)
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 --release 17 -cp out -d tools/dreamreader/out tools/dreamreader/*.java
          golden=tools/dreamreader/golden/otto-aydin-seed1-6000.page
          java -cp out:tools/dreamreader/out DreamReader \
            --pilot "Otto Aydin" --seed 1 --ticks 6000 --check-golden "$golden" \
            | tee "${RUNNER_TEMP:-/tmp}/golden.log"
          grep -qE "^GOLDEN OK $golden \([0-9]+ bytes\)$" "${RUNNER_TEMP:-/tmp}/golden.log" \
            || { echo "FATAL the teleprinter reached no GOLDEN OK verdict" >&2; exit 1; }

      # WHY: the blessing above is one question the tool answers; the NUMBER it answers with
      # is the other (#1011). The reader publishes an exit grammar in three places and used
      # to obey none of them: five conditions reached 2 and three reached 1, so a caller
      # could not tell a refused invocation from a name the record does not hold from a page
      # that drifted. This suite runs one invocation per code. Its fixtures are blessed in a
      # temp directory rather than read from golden/, so it judges the GRAMMAR only — a page
      # that legitimately moves goes red in the step above, once, under its own name. Piped
      # to tee for that step's reason: under pipefail a red suite fails the lane AND its rows
      # reach the log, which is the whole point of a per-case report.
      # The case count carries a floor for the sweep's reason (#1073): `cases=[1-9][0-9]*`
      # passes a suite of one, and this suite exists precisely because the five codes were
      # once indistinguishable — a run that lost the rows for 1 and 4 would report a
      # grammar it no longer checks, in the tool's own words, and go green.
      - name: tools — the teleprinter's exit grammar (#1011)
        shell: bash
        run: |
          set -euo pipefail
          floor=10   # raise it in the PR that adds a case; lowering it is a claim, not a bump
          bash tools/dreamreader/exitgrammar.sh | tee "${RUNNER_TEMP:-/tmp}/exitgrammar.log"
          verdict="$(grep -xE 'EXIT VERDICT PASS cases=[0-9]+ fail=0' \
            "${RUNNER_TEMP:-/tmp}/exitgrammar.log" || true)"
          [ -n "$verdict" ] \
            || { echo "FATAL the teleprinter's grammar is not the one it publishes" >&2; exit 1; }
          ran="${verdict##*cases=}"; ran="${ran%% *}"
          [ "$ran" -ge "$floor" ] \
            || { echo "FATAL the grammar suite ran $ran cases and the floor is $floor — cases went missing, or the floor was lowered without saying so" >&2; exit 1; }
          echo "EXIT GRAMMAR FLOOR OK cases=$ran floor=$floor"

      # WHY: lock 10 — the permanent control group (D-042's ruling, #212). NEUTRAL is not a
      # migration step and this lane does not retire: it runs the flagged world at the
      # canonical seed and holds its chain against the sealed baseline, link by link, forever.
      # Failing on the FIRST unequal link is deliberate — the first divergence is the only one
      # that carries information; every link after it is that link's echo. The fixture's edit
      # rule lives beside it (ci/fixtures/README.md) and is the half of this lock that CI
      # cannot enforce: a baseline regenerated to make a build green is not a control group.
      #
      # The comparison is `probes/NeutralDiff` (#537, #339) rather than an awk written here.
      # This lane shipped its own inline comparison because the referee did not exist yet and
      # a control group guarded from two merges onward is a control group unguarded for one;
      # the referee landed on 2026-08-13, reads this exact fixture, and #532's DoD is its
      # verdict line and not ours. A lane that keeps a second implementation of the referee's
      # job is a second thing to keep in step — so the inline awk is deleted rather than kept
      # beside it. The exact-line grep is the contract, as it is for every judged probe.
      # The referee is the probe that does NOT exit 0, which is why the run is streamed through
      # tee rather than captured (tools/README.md's capture rule): it prints the first unequal
      # link and exits 1, or refuses with seal_missing and exits 2, so `out="$(...)"` died on the
      # assignment and threw away the one line in the run that carries information.
      - name: neutral lane (control group vs the sealed baseline, refereed)
        shell: bash
        run: |
          set -euo pipefail
          java -cp out:probes/out NeutralDiff | tee "${RUNNER_TEMP:-/tmp}/neutraldiff.log"
          grep -qxF 'NEUTRALDIFF 60/60 byte-equal VERDICT PASS' \
            "${RUNNER_TEMP:-/tmp}/neutraldiff.log" \
            || { echo "FATAL the control group moved, or the referee did not judge it" >&2; exit 1; }

      # WHY: the gate on the artifact that LEAVES this repository was the weaker of the two
      # gates, and nothing said so (#1052). `tools/release.sh` ran compile, --selftest at the
      # standard budget and --bench: it never read the seal pin, never ran the full arc, never
      # swept the probes — so a tree this lane would refuse on a pull request could still be
      # tagged and published. It now runs locks 1-7 above, and this step is the runner that
      # keeps it that way. Same shape as #965 and #901: a path only a release exercises is a
      # path nobody exercises, and that is exactly how the divergence opened unseen — --check
      # was itself written to fix a lock that had been unrunnable for 62 commits (#972).
      # Which locks a release still skips, and why, is written in tools/README.md.
      #
      # LAST on purpose: --check rebuilds from a clean out/ and a clean probes/out, so it
      # deletes what the steps above compiled. Nothing may follow it that expects those trees.
      # Needs no token and no network — --check tags nothing, pushes nothing, and skips the
      # release preflight (main, clean tree, in step with origin), which guards the TAG and
      # not the locks. Piped to tee for the sweep's reason: under pipefail a red release gate
      # fails the lane AND its rows reach the log. The verdict's lock COUNT is matched loosely
      # rather than pinned at 7/7, so the next lock the release gains is one edit in the
      # script and no edit here — the script exits before printing this line if any lock is
      # red, so its exit code is what judges the count.
      - name: tools — the release gate reaches this lane's floor (#1052)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release.sh --check | tee "${RUNNER_TEMP:-/tmp}/release.log"
          grep -qE '^RELEASE CHECK [1-9][0-9]*/[1-9][0-9]* locks green VERDICT PASS commit=[0-9a-f]{12} tagged=none$' \
            "${RUNNER_TEMP:-/tmp}/release.log" \
            || { echo "FATAL the release gate reached no passing verdict" >&2; exit 1; }
