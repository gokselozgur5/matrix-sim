# .github/workflows/locks.yml — CI as a runner, not a framework (D-040, gate #137).
#
# Every PR to main carries the light-lock litany the operator used to run by
# hand: the same zero-dependency commands, with exit codes and greppable
# verdict lines as the only judges. No plugins, no build tool — the daemon
# still builds with javac alone (Dev7 / D-009). Rollback is deleting this file.

name: locks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  locks:
    runs-on: ubuntu-latest
    # WHY: backstop only — the litany finishes in minutes; a hung JVM must not eat the meter.
    timeout-minutes: 15
    steps:
      # WHY: the litany judges the tree as pushed — no caches, no artifacts from elsewhere.
      # WHY fetch-depth 0: two locks read history rather than the tree. Lock 9 compares this
      # tree's seal pin against the BASE's and reads the commit messages in between; a
      # depth-1 checkout has neither, and a gate that cannot see the base would pass every
      # move (#884). Lock 0 dates the PR's evidence against main, and a shallow clone would
      # call every honest sha unknown and blame the author for the runner's configuration.
      - name: check out the tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WHY: lock 0 — the only lock that judges a claim rather than a compilation (#822).
      # It asks the PR which main its evidence was measured against, and checks whether
      # that is still the main underneath it. Warns on drift, and fails when this PR moves
      # the seal and its 'before' is not the tree's before — a move nobody can verify.
      # Whether the seal moved is read off .github/canonical-digest, not off the body.
      #
      # The body goes through env and a file, never through interpolation into this
      # script: a PR body is text a stranger can write, and `${{ }}` into a `run:` block
      # is how that stranger runs commands on the runner.
      - name: evidence baseline
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash tools/baseline.sh "$RUNNER_TEMP/pr-body.md" "$BASE_SHA"

      # WHY: lock 0 judges one body against one base, so on a green day it walks one of its
      # paths and every other path is a claim. The suite runs all of them against this
      # repository's real history — including the ones the runner will almost never reach:
      # a stated sha that is not a commit, and a seal move whose 'before' is not the tree's
      # before. Every fixture is built out of git rather than hardcoded, so the suite dates
      # no better and no worse than the tree it runs in. Not PR-only: the cases are about
      # history, which a push to main also has.
      - name: evidence baseline — the checker's own cases
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash tools/baseline.sh --selftest)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qE '^BASELINE SELFTEST VERDICT PASS cases=[1-9][0-9]* failed=0$' \
            || { echo "FATAL the baseline suite reached no passing verdict" >&2; exit 1; }

      # WHY: Temurin 17 is the JDK the locks are calibrated on; setup-java only puts javac/java on PATH.
      - name: put JDK 17 on PATH
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # WHY: lock 1 — the tree compiles from nothing, the same line release.sh runs at cut time.
      - name: compile src
        run: javac -encoding UTF-8 --release 17 -d out $(find src -name '*.java')

      # WHY: lock 2 — digest double-run at the standard budget; exit code is the verdict.
      - name: selftest (2,000 ticks)
        run: java -cp out matrix.Main --selftest

      # WHY: lock 3 — the finale gate; hardcoded 2,000 ticks once left the finale untested (skeptic finding).
      - name: selftest (6,000 ticks — full arc)
        run: java -cp out matrix.Main --selftest --ticks 6000

      # WHY: lock 4 — the D-027 budget table verdicts by exit code; the generous timeout is a
      # hang-guard, not the bound — the bound is bench's own 30 s full-arc row.
      - name: bench
        timeout-minutes: 10
        run: java -cp out matrix.Main --bench

      # WHY: lock 5 — the skeptic's bench must compile against the daemon it dissects (probes stay outside the build).
      - name: compile probes
        run: javac -encoding UTF-8 --release 17 -cp out -d probes/out probes/*.java

      # WHY: lock 6 — probes always exit 0, so the verdict line itself is the contract:
      # exact-line grep (-x), so =0 can never match =01 and a missing line fails the job.
      # This step used to carry five of those rows inline. probes/bench.sh carries the same
      # contract for every probe, beside the probes, and the two lists had drifted: fifteen
      # judged rows in the bench, five of them here, so nine guards ran only when a human
      # typed the command — and DistrictNeutral (#536) was in neither file, a
      # stream-neutrality guard nobody ran at all. Copying the missing rows into this file
      # would fix that list and keep the shape that made it, so the workflow now reads the
      # bench's table instead of keeping a rival one (#789). Adding a probe is a one-row
      # change beside the probe, and this file needs no edit — which is what #849's row
      # asked for in the sentence it shipped with.
      #
      # The law is unchanged, one level down: each judged row is grep -qxF against its exact
      # verdict line inside the script. What this step judges is the summary, which carries
      # elapsed seconds and so is matched anchored rather than exactly — judged=[1-9] is
      # there so an emptied table cannot report a green sweep of nothing. --no-build reuses
      # locks 1 and 5 rather than compiling the tree twice; tee keeps the log on a red run,
      # where the failing rows are the reason to have one.
      - name: probe sweep (probes/bench.sh — every judged row, 6,000 ticks each)
        shell: bash
        run: |
          set -euo pipefail
          bash probes/bench.sh --no-build | tee "${RUNNER_TEMP:-/tmp}/sweep.log"
          grep -qE '^BENCH .* judged=[1-9][0-9]* .* fail=0 .* VERDICT BENCH_GREEN$' \
            "${RUNNER_TEMP:-/tmp}/sweep.log" \
            || { echo "FATAL the sweep printed no green summary line" >&2; exit 1; }

      # WHY: lock 7 — the one question locks 1-6 cannot ask. Locks 2 and 3 compare a run to
      # another run of the same binary, and a seal that got smaller weakens both sides
      # equally: commenting out x, y and alive in World.digestEntity passes all six locks
      # above (#898). Only a number from outside the run can refuse that, and the number
      # lives in .github/canonical-digest rather than in this file, so a declared digest
      # move is one data line edited with its reason attached and `git log -p` on that file
      # is the whole move history. Exact string compare, not a substring match: a pin that
      # matched a prefix would accept a longer sha.
      - name: canonical digest (seed 42, 6,000 ticks)
        shell: bash
        run: |
          set -euo pipefail
          pin=.github/canonical-digest
          [ -f "$pin" ] || { echo "FATAL $pin is missing — the seal has no home" >&2; exit 1; }
          payload="$(grep -vE '^[[:space:]]*(#|$)' "$pin" || true)"
          n="$(printf '%s\n' "$payload" | grep -c '[^[:space:]]' || true)"
          [ "$n" = 1 ] || { echo "FATAL $pin holds $n payload lines, want exactly 1" >&2; exit 1; }
          sha="$(printf '%s\n' "$payload" | awk '{print $1}')"
          printf '%s\n' "$sha" | grep -qxE '[0-9a-f]{64}' \
            || { echo "FATAL $pin does not open with a 64-hex sha: $sha" >&2; exit 1; }
          [ "$(printf '%s\n' "$payload" | awk '{print NF}')" -ge 2 ] \
            || { echo "FATAL $pin gives a sha and no reason; the payload is <sha> then why it is the sha" >&2; exit 1; }
          want="DIGEST tick=6000 sha=$sha"
          out="$(java -cp out matrix.Main --headless --ticks 6000 --seed 42)"
          got="$(printf '%s\n' "$out" | grep -E '^DIGEST tick=6000 ' || true)"
          printf 'pinned %s\nprinted %s\n' "$want" "${got:-<no DIGEST tick=6000 line at all>}"
          [ "$got" = "$want" ] || { echo "FATAL the seal moved — if that was deliberate, edit $pin in this PR and say why" >&2; exit 1; }

      # WHY: lock 8 — D-020's line grammar is a BYTE contract, and nothing owned the charset
      # those bytes were written in (#836): with no locale exported JDK 17 resolves the
      # default charset to ANSI_X3.4-1968 and every em dash a main() printed became '?'.
      # This runner is NOT that box — the ubuntu-latest image exports a UTF-8 locale, and
      # pre-fix main printed the em dash here intact — which is exactly why the step forces
      # LC_ALL=C instead of trusting the environment. The lane that has to catch a
      # locale-dependent defect cannot wait to be run on a hostile box; it makes one.
      # Three captures because the pin has three ways to be forgotten — the daemon's stdout,
      # its stderr, a probe's stdout — plus the source scan, because those three are instances
      # and every probe main is the class. Each capture is asserted to CARRY the byte the bug
      # destroys: a check that compares two empty files passes and proves nothing.
      - name: charset — an instrument line is the same bytes on every box (#836)
        shell: bash
        run: |
          set -euo pipefail
          same() { # same <label> <utf8-capture> <ascii-capture>
            cmp -s "$2" "$3" && echo "CHARSET $1 OK" \
              || { echo "FATAL $1 differs between UTF-8 and LC_ALL=C" >&2; diff "$2" "$3" >&2; exit 1; }
          }
          carries() { # carries <file> <byte sequence the run must have printed>
            grep -q "$2" "$1" || { echo "FATAL $1 carries no $2 — this check proves nothing" >&2; exit 1; }
          }
          java -cp out matrix.Main --help > help.utf8
          LC_ALL=C java -cp out matrix.Main --help > help.ascii
          carries help.utf8 '—'
          same daemon_stdout help.utf8 help.ascii
          java -cp out matrix.Main --scale 0 2> err.utf8 || true
          LC_ALL=C java -cp out matrix.Main --scale 0 2> err.ascii || true
          carries err.utf8 '—'
          same daemon_stderr err.utf8 err.ascii
          java -cp out:probes/out DistrictNeutral > dn.utf8
          LC_ALL=C java -cp out:probes/out DistrictNeutral > dn.ascii
          carries dn.utf8 '·'
          same probe_stdout dn.utf8 dn.ascii
          rm -f help.utf8 help.ascii err.utf8 err.ascii dn.utf8 dn.ascii
          scanned=0 unpinned=0
          for f in probes/*.java; do
            grep -q 'static void main(String\[\] args)' "$f" || continue
            scanned=$((scanned + 1))
            grep -q 'matrix\.Streams\.utf8();' "$f" \
              || { echo "FATAL $f prints without pinning its streams" >&2; unpinned=$((unpinned + 1)); }
          done
          [ "$unpinned" -eq 0 ] || exit 1
          echo "CHARSET probe_pins OK scanned=$scanned unpinned=0"

      # WHY: lock 9 — lock 7 refuses an UNDECLARED move, and there is exactly one way to
      # make it green again: paste the printed sha into the pin. That keystroke is the same
      # whether the mover reasoned or was tired of the red X, and afterwards the tree cannot
      # tell them apart — which is how a control group quietly stops being one (#884, RULING
      # #212). This step asks the other half: the pin moved, so was that a decision? It is
      # armed by the act it governs — NONE and green for every unit that leaves the world's
      # bytes alone, and it cannot be satisfied by editing this file, because what it reads
      # is a commit message and the pin's own reason field.
      # PR-only, and for the same reason the attribution step is: a push to main has no base
      # branch to compare against, and by then the move has already landed — this gate is
      # meant to be met before the merge button, not to paint main red after it.
      - name: the seal moved, so the move is argued (#884)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/digest-move.sh --base "origin/$BASE_REF"

      # WHY: tools/ had no runner at all, and #901 is the bug that hides exactly there —
      # a GNU-only `date -d` idiom, green on this box and dead on the macOS box that is the
      # only one to ever type the command. This step owns the LINUX half of that unit: the
      # operator proves the BSD dialect by running it, the runner proves the GNU one, and
      # the asserted `dialect=gnu` is what stops this from re-proving the same half twice.
      # Needs no token and no network — it judges the calendar, not the account.
      # The run is piped to tee rather than captured, for the same reason the sweep and the
      # golden day are: `out="$(...)"` under set -e dies ON THE ASSIGNMENT when the script
      # exits 5, so the printf that would have shown the eleven executed cases never ran, and
      # neither did the FATAL two lines below it — the one lock built to catch a dialect bug
      # reported one as a red step with an empty log (#983). Through the pipe, tee has already
      # put the failing offsets in the log by the time pipefail fails the step, and an executed
      # case is the only thing that tells the two boxes apart.
      # WHY: the commit leg of D-060 counted zero of the 258 unit commits this repository had
      # shipped, because they carried an address GitHub resolves to the owner's OTHER account
      # (#910). A global `git config` is invisible to everyone who did not type it, so the rule
      # gets a reader rather than a note. PR-only: a push to main has no pull request to read,
      # and by then the commit is already in the history this is meant to keep clean.
      - name: tools — every commit on this PR is attributed to the owner (#910)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/attribution.sh --pr ${{ github.event.pull_request.number }}

      - name: tools — balance.sh day arithmetic, GNU dialect (#901)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/balance.sh --datecheck | tee "${RUNNER_TEMP:-/tmp}/datecheck.log"
          grep -q '^DATECHECK VERDICT PASS dialect=gnu ' "${RUNNER_TEMP:-/tmp}/datecheck.log" \
            || { echo "FATAL the runner did not reach a passing GNU-dialect verdict" >&2; exit 1; }

      # WHY: #828's complaint is a claim about what the meter CAN say — that no window could
      # reach verdict=OK — and a reachability claim is worth exactly what an executed case
      # makes it worth. --rulercheck runs the ruler and the floor over day vectors whose right
      # answers arithmetic already settled, including the pair that IS the unit: one sweep day
      # beside six ordinary ones reads LAGGING:review by events and OK by day-shape. Needs no
      # token and no network — it judges the arithmetic, not the account.
      - name: tools — balance.sh ruler and floor (#828)
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash tools/balance.sh --rulercheck)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^RULERCHECK VERDICT PASS ' \
            || { echo "FATAL the ruler did not reach a passing verdict" >&2; exit 1; }

      # WHY: lock 11 — the teleprinter's golden day (D-047, #965). Locks 2, 3 and 7 pin the
      # daemon's BYTES; nothing pinned the SENTENCES a tool writes over them, and --check-golden
      # was written to ask that question and then never asked by anything — three grep hits, all
      # inside the file that implements it. Unrun, it drifted from the moment it landed: the
      # blessing was taken against a tree older than its own commit and was already 198 bytes
      # behind at dc5bea4, and the world has moved twice more since. A golden file no lane runs
      # is a comment (tools/README.md's own house rule), so the lane runs it.
      # tools/ is outside the daemon build, so this step compiles the reader itself — against
      # lock 1's out/, which is why it stands after it and not with the other tools steps by
      # accident. Needs no token and no network: it renders one day and compares it to a file.
      # The tool exits 1 on drift and prints the first line that moved, so the run is piped to
      # tee rather than captured — under pipefail the exit code fails the step AND the moved
      # line reaches the log, which is the whole point of a drift report. The verdict grep is
      # exact-line but for the byte count, so an empty or truncated page cannot pass as OK.
      - name: tools — the teleprinter's golden day (#965)
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 --release 17 -cp out -d tools/dreamreader/out tools/dreamreader/*.java
          golden=tools/dreamreader/golden/otto-aydin-seed1-6000.page
          java -cp out:tools/dreamreader/out DreamReader \
            --pilot "Otto Aydin" --seed 1 --ticks 6000 --check-golden "$golden" \
            | tee "${RUNNER_TEMP:-/tmp}/golden.log"
          grep -qE "^GOLDEN OK $golden \([0-9]+ bytes\)$" "${RUNNER_TEMP:-/tmp}/golden.log" \
            || { echo "FATAL the teleprinter reached no GOLDEN OK verdict" >&2; exit 1; }

      # WHY: lock 10 — the permanent control group (D-042's ruling, #212). NEUTRAL is not a
      # migration step and this lane does not retire: it runs the flagged world at the
      # canonical seed and holds its chain against the sealed baseline, link by link, forever.
      # Failing on the FIRST unequal link is deliberate — the first divergence is the only one
      # that carries information; every link after it is that link's echo. The fixture's edit
      # rule lives beside it (ci/fixtures/README.md) and is the half of this lock that CI
      # cannot enforce: a baseline regenerated to make a build green is not a control group.
      #
      # The comparison is `probes/NeutralDiff` (#537, #339) rather than an awk written here.
      # This lane shipped its own inline comparison because the referee did not exist yet and
      # a control group guarded from two merges onward is a control group unguarded for one;
      # the referee landed on 2026-08-13, reads this exact fixture, and #532's DoD is its
      # verdict line and not ours. A lane that keeps a second implementation of the referee's
      # job is a second thing to keep in step — so the inline awk is deleted rather than kept
      # beside it. Probes exit 0 by house rule, so the exact-line grep is the contract.
      - name: neutral lane (control group vs the sealed baseline, refereed)
        shell: bash
        run: |
          set -euo pipefail
          out="$(java -cp out:probes/out NeutralDiff)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qxF 'NEUTRALDIFF 60/60 byte-equal VERDICT PASS' \
            || { echo "FATAL the control group moved, or the referee did not judge it" >&2; exit 1; }
