name: orchestra review
on:
  workflow_run:
    workflows: [locks]
    types: [completed]
concurrency:
  group: orchestra-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && vars.ORCHESTRA_CODEX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read}
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      reviewed_head: ${{ steps.resolve.outputs.reviewed_head }}
      reviewed_base: ${{ steps.resolve.outputs.reviewed_base }}
      prompt_sha: ${{ steps.packet.outputs.prompt_sha }}
    steps:
      - name: check out the trusted packet builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.workflow_sha }}", path: trusted, persist-credentials: false, sparse-checkout: tools/orchestra-review.sh, sparse-checkout-cone-mode: false}
      - name: resolve exactly one eligible pull request
        id: resolve
        env: {GH_TOKEN: "${{ github.token }}", GH_REPOSITORY: "${{ github.repository }}", RUN_HEAD_SHA: "${{ github.event.workflow_run.head_sha }}"}
        run: bash trusted/tools/orchestra-review.sh resolve
      - name: check out the exact reviewed head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ steps.resolve.outputs.reviewed_head }}", path: subject, fetch-depth: 0, persist-credentials: false}
      - name: build the bounded static-review packet
        id: packet
        env:
          REVIEW_HEAD: "${{ steps.resolve.outputs.reviewed_head }}"
          REVIEW_BASE: "${{ steps.resolve.outputs.reviewed_base }}"
          SUBJECT_DIRECTORY: "${{ github.workspace }}/subject"
          REVIEW_PROMPT_FILE: "${{ runner.temp }}/orchestra-review/prompt.txt"
        run: bash trusted/tools/orchestra-review.sh prepare
      - name: upload only the review packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orchestra-review-${{ steps.resolve.outputs.reviewed_head }}
          path: ${{ runner.temp }}/orchestra-review/prompt.txt
          if-no-files-found: error
          retention-days: 1
  review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read}
    outputs:
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      reviewed_head: ${{ needs.prepare.outputs.reviewed_head }}
      reviewed_base: ${{ needs.prepare.outputs.reviewed_base }}
      review_json: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: check out only trusted reviewer policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.workflow_sha }}"
          path: trusted
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/orchestra-codex/config.toml
            tools/orchestra-review.sh
      - name: download the exact review packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orchestra-review-${{ needs.prepare.outputs.reviewed_head }}
          path: ${{ runner.temp }}/orchestra-review
      - name: verify the packet before introducing the secret
        env:
          REVIEW_HEAD: "${{ needs.prepare.outputs.reviewed_head }}"
          REVIEW_BASE: "${{ needs.prepare.outputs.reviewed_base }}"
          REVIEW_PROMPT_FILE: "${{ runner.temp }}/orchestra-review/prompt.txt"
          REVIEW_PROMPT_SHA: "${{ needs.prepare.outputs.prompt_sha }}"
        run: bash trusted/tools/orchestra-review.sh verify-packet
      # Last by construction: no PR checkout ever entered this job. The model sees
      # one bounded text packet, and trusted config removes every execution tool.
      - name: no-exec Codex review sensor
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.153.4
          model: gpt-6-astra
          effort: low
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-home: ${{ github.workspace }}/trusted/.github/orchestra-codex
          working-directory: ${{ runner.temp }}/orchestra-review
          codex-args: '["--ephemeral"]'
          prompt-file: ${{ runner.temp }}/orchestra-review/prompt.txt
          output-schema: |
            {"type":"object","additionalProperties":false,"required":["reviewed_head","verdict","summary","findings","limits"],"properties":{"reviewed_head":{"type":"string","pattern":"^[0-9a-f]{40}$"},"verdict":{"type":"string","enum":["READY","CHANGES_REQUIRED"]},"summary":{"type":"string","minLength":1,"maxLength":2000},"findings":{"type":"array","maxItems":20,"items":{"type":"object","additionalProperties":false,"required":["severity","path","line","message"],"properties":{"severity":{"type":"string","enum":["BLOCKING","WARNING","NOTE"]},"path":{"type":"string","minLength":1,"maxLength":500},"line":{"type":"integer","minimum":1,"maximum":10000000},"message":{"type":"string","minLength":1,"maxLength":2000}}}},"limits":{"type":"array","minItems":1,"maxItems":10,"items":{"type":"string","minLength":1,"maxLength":500}}}}
  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read, issues: write, statuses: write}
    steps:
      - name: check out the trusted publisher tool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.workflow_sha }}", path: trusted, persist-credentials: false, sparse-checkout: tools/orchestra-review.sh, sparse-checkout-cone-mode: false}
      - name: validate and publish the exact-head receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.review.outputs.reviewed_head }}
          EXPECTED_BASE: ${{ needs.review.outputs.reviewed_base }}
          REVIEW_JSON: ${{ needs.review.outputs.review_json }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash trusted/tools/orchestra-review.sh publish
