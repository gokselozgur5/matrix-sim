name: Decision gate
description: The discussion thread for one D-number — closes ONLY by the Architect's verdict here
labels: ["decision"]
body:
  - type: markdown
    attributes:
      value: |
        A 🟡 decision never merges into code undiscussed (D-000). Crew dossiers are arguments;
        the verdict in this thread is the permission. After the verdict, the machine performs
        the flip: record status + index emoji together, citing the verdict comment.
  - type: input
    id: dnumber
    attributes:
      label: D-number and title
      placeholder: "D-040: JUnit and CI — reopening D-009"
    validations:
      required: true
  - type: textarea
    id: ystatement
    attributes:
      label: Y-statement seed
      description: "In the context of ..., facing ..., we lean toward ..., and against ..., to achieve ..., accepting that ..."
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options on the table
      description: Each option one line — the record (docs/adr/) carries the full pros and cons.
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: What closes this gate
      value: "The Architect's verdict as a comment in this thread. One word suffices; the record quotes it."
    validations:
      required: false
  - type: textarea
    id: reading
    attributes:
      label: Measured — the reading behind the concern
      description: >-
        A Y-statement's "facing <concern>" is usually an empirical claim — the sweep costs
        too much, the API is unreliable, the seed diverges. Put the run here. D-060 was
        argued from a measured day and nothing in this template asked for it. A decision is
        more expensive to get wrong than a build unit: it becomes a record that is immutable
        under D-029, so an unmeasured premise costs a second ADR rather than an edit.
        "Not measured, and why" is a valid answer — some concerns are about what a shape
        will do, not what it has done.
      placeholder: |
        tools/balance.sh --repo 2026-08-12
        BALANCE commits=603 issues=0 prs=0 reviews=0 verdict=THIN — the day that opened D-060
    validations:
      required: true
