name: Build unit
description: One unit of buildable work — becomes exactly one PR that closes this issue (D-039)
labels: ["build-unit"]
body:
  - type: markdown
    attributes:
      value: |
        One unit = one small PR + `Closes #N` + atomic commits carrying finding, fix, and evidence.
        Gates before units: if this unit executes a 🟡/🔵 decision, the verdict must land in the gate thread first.
        Does this unit change the world's bytes? If so it is a **declared digest move** — pick that
        lock tier, and the PR argues the move rather than reporting it (#884).
  - type: textarea
    id: statement
    attributes:
      label: Unit statement
      description: What exists when this unit is done that does not exist now — mechanism, not file list.
      placeholder: "A `probes/LedgerMirror` instrument holds every ledger delta to the open-link residue mirror..."
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measured
      description: >-
        The command you ran and the line it printed. An issue written from a SHAPE the tree
        keeps producing, rather than from a run, is fileable — write "not measured" and why.
        Saying so is the point: an absence is invisible, a declaration is not. #1215 claimed a
        drift that DocLint had been checking all along, and #1212's central measurement was
        wrong because it grepped a source for a flag instead of running it.
      placeholder: |
        gh run list --workflow litany.yml --limit 6
        main  push  failure     ← eleven runs, all zero seconds

        or: not measured — this is a shape, not a sighting: every catalog row
        that quotes a count will rot, and none has yet.
    validations:
      required: true
  - type: input
    id: decisions
    attributes:
      label: Decisions executed
      description: The 🟢 records this unit executes (IDs), or the gate thread it waits on.
      placeholder: "D-022, D-030 — no open gates"
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Machine-checkable — a command and the line it must print.
      placeholder: "java -cp out:probes/out LedgerMirror 6000 prints LEDGER_ANOMALIES=0"
    validations:
      required: true
  - type: dropdown
    id: locks
    attributes:
      label: Lock tier expected
      options:
        - "light — compile · --selftest · digest (docs-only: n/a)"
        - "light + bench — speed-adjacent work"
        - "declared digest move — this unit changes the world's bytes; the move is argued in the PR"
        - "full — phase boundary, adversarial skeptic pass"
    validations:
      required: true
